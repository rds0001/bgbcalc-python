[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgbcalc"
version = "0.1.0"
description = "Native calculations for German Civil Code rules (BGB-Rechenregeln)"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "RiskDataScience GmbH"}]
maintainers = [{name = "Dr. Dimitrios Geromichalos", email = "riskdatascience@web.de"}]
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)", "Programming Language :: Python :: 3", "Natural Language :: German"]
dependencies = []

[project.urls]
Repository = "https://github.com/rds0001/bgbcalc-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bgbcalc = ["py.typed", "*.pyi", "daten/*.json.gz"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
