name: Publish to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        default: '0.1.0'
        type: string
permissions:
  contents: read
concurrency:
  group: publish-pypi
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert metadata['project']['version'] == os.environ['RELEASE_VERSION'], 'Version mismatch'
          PY
      - run: python -m pip install build twine pytest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python tools/pruefe_installiertes_python.py --bericht referenzpruefung.json
      - run: python tools/pruefe_installierte_kompositionen.py --bericht kompositionspruefung.json
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/bgbcalc/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
